name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.14.0'
      - run: npm test
      - run: node tools/check-text.js

  # Builds the installer and runs it quietly on a clean machine, so a broken
  # installer is seen here instead of on someone's computer after an update.
  installer:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.14.0'
      - run: choco install innosetup --version=6.7.1 --no-progress -y
      - run: node tools/build-installer.js
      - run: node tools/smoke-installer.js
